[package]
name = "newagt-cli"
version.workspace = true
description = "CLI for NewAgt — read, validate, and convert imagery ground truth AGT"
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["agt", "ground-truth", "imagery", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "newagt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
newagt-core = { path = "../newagt-core" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
