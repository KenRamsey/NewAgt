[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "newagt"
version = "0.1.0"
description = "Imagery ground truth AGT parser and trainer helpers (Rust core via PyO3)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.maturin]
manifest-path = "crates/newagt-py/Cargo.toml"
python-source = "python"
module-name = "newagt._native"
